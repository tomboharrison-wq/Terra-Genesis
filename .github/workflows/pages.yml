# Free backup host: build the app and publish it to GitHub Pages on every push to main
# (https://tomboharrison-wq.github.io/Terra-Genesis/). Netlify keeps deploying too.
name: GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'tests/**', 'scripts/**', '**/*.md', 'desktop/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          COMMIT_REF: ${{ github.sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
