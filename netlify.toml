[build]
  command = "npm run build"
  publish = "dist"
  # Skip the build (no deploy used) when a push changes only notes, tests, test scripts, CI or the Mac wrapper.
  # Exit 0 = skip, 1 = build.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)docs' ':(exclude)tests' ':(exclude)*.md' ':(exclude)desktop' ':(exclude)scripts' ':(exclude).github'"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
